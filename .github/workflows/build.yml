name: Build & Release ADB File Manager

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Artifact Generation
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build Solution (Release)
      run: msbuild ADBFileManager.csproj /p:Configuration=Release /p:OutputPath=bin\Release\

    - name: Upload Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ADBFileManager-exe
        path: bin/Release/ADBFileManager.exe

    - name: Publish Tagged Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: bin/Release/ADBFileManager.exe
        name: ADB File Manager ${{ github.ref_name }}
        body: |
          ## 📱 ADB File Manager ${{ github.ref_name }}
          Automated release build of ADB File Manager.
          Download `ADBFileManager.exe` below to run directly on Windows (no installation required).
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Publish Latest Main Build
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        files: bin/Release/ADBFileManager.exe
        tag_name: latest
        name: ADB File Manager (Latest Build)
        body: |
          ## 📱 ADB File Manager (Latest Nightly / Main Build)
          Automated build compiled from latest commit on `main`.
          Download `ADBFileManager.exe` below to run directly on Windows.
        draft: false
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
